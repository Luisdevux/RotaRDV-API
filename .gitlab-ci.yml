stages:
  - build
  - deploy

variables:
  DOCKER_IMAGE: $DOCKERHUB_USER/rotardv-api:$CI_COMMIT_SHORT_SHA
  KUBERNETES_NAMESPACE: "rotardv-prod"
  KUBERNETES_NAMESPACE_QA: "rotardv-qa"
  ENABLE_QA: "false" # <-- Alternar para "true" para ativar o deploy de QA

build_job:
  stage: build
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'
  image:
    name: gcr.io/kaniko-project/executor:debug
    entrypoint: [""]
  tags:
    - k3s-runner-rotardv
  script:
    - echo "{\"auths\":{\"https://index.docker.io/v1/\":{\"auth\":\"$(printf "%s:%s" "${DOCKERHUB_USER}" "${DOCKERHUB_PASS}" | base64 | tr -d '\n')\"}}}" > /kaniko/.docker/config.json
    - /kaniko/executor --context "${CI_PROJECT_DIR}" --dockerfile "${CI_PROJECT_DIR}/Dockerfile" --destination "${DOCKER_IMAGE}"

deploy_job:
  stage: deploy
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'
  image: bitnami/kubectl:latest
  tags:
    - k3s-runner-rotardv
  script:
    - kubectl set image deployment/rotardv-api rotardv-api=$DOCKER_IMAGE -n $KUBERNETES_NAMESPACE
    - kubectl rollout status deployment/rotardv-api -n $KUBERNETES_NAMESPACE

build_job_qa:
  stage: build
  rules:
    - if: '$ENABLE_QA == "true" && $CI_COMMIT_BRANCH == "develop"'
  image:
    name: gcr.io/kaniko-project/executor:debug
    entrypoint: [""]
  tags:
    - k3s-runner-rotardv
  script:
    - echo "{\"auths\":{\"https://index.docker.io/v1/\":{\"auth\":\"$(printf "%s:%s" "${DOCKERHUB_USER}" "${DOCKERHUB_PASS}" | base64 | tr -d '\n')\"}}}" > /kaniko/.docker/config.json
    - /kaniko/executor --context "${CI_PROJECT_DIR}" --dockerfile "${CI_PROJECT_DIR}/Dockerfile" --destination "${DOCKER_IMAGE}"

deploy_job_qa:
  stage: deploy
  rules:
    - if: '$ENABLE_QA == "true" && $CI_COMMIT_BRANCH == "develop"'
  image: bitnami/kubectl:latest
  tags:
    - k3s-runner-rotardv
  script:
    - kubectl scale deployment/rotardv-api --replicas=1 -n $KUBERNETES_NAMESPACE_QA
    - kubectl set image deployment/rotardv-api rotardv-api=$DOCKER_IMAGE -n $KUBERNETES_NAMESPACE_QA
    - kubectl rollout status deployment/rotardv-api -n $KUBERNETES_NAMESPACE_QA
